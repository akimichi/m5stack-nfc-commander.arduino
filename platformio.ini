; m5stack-nfc-commander
; M5Stack CoreS3 + NFC Universal Unit (ST25R3916)
;
; 仕様書: docs/specification.md

[platformio]
default_envs = debug

; ---------------------------------------------------------------------------
; 実機 (CoreS3) 共通設定
;
; USB について:
;   ボード定義 m5stack-cores3.json の extra_flags には
;   -DARDUINO_USB_MODE=1 / -DARDUINO_USB_CDC_ON_BOOT=1 が固定で入っている。
;   USB HID キーボード出力には TinyUSB (ARDUINO_USB_MODE=0) が必要なため、
;   build_unflags で打ち消したうえで各 env で定義し直している。
; ---------------------------------------------------------------------------
[cores3]
platform = espressif32@7.0.1
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ボード定義の hwids は 0x303A:0x8119 だが、TinyUSB 構成の実機は
; 0x303A:0x1001 で列挙される。マッチしないとポート自動検出が働かず、
; pio device monitor が別のシリアルポート (/dev/ttyS0 など) に繋いでしまう。
board_hwids =
    0x303A:0x1001
    0x303A:0x8119

; ライブラリは仕様書 §8-5 の方針によりバージョンを固定する
lib_deps =
    m5stack/M5Unified@0.2.20
    m5stack/M5Unit-NFC@0.1.0

; 注意: PlatformIO は build_unflags を build_flags の「後」に適用する。
;       そのため build_unflags と build_flags に同じ文字列を書くと、
;       追加したはずのフラグまで除去されて未定義になる。
;       ARDUINO_USB_CDC_ON_BOOT はボード定義が =1 を持つため、
;       1 のまま使う debug では unflag してはならない。
build_unflags =
    -DARDUINO_USB_MODE=1

; 開発ビルド: HID + CDC 複合。シリアルログでデバッグできる
; CDC_ON_BOOT はボード定義の =1 をそのまま使う (unflag しない)
[env:debug]
extends = cores3
build_type = debug
build_flags =
    -DARDUINO_USB_MODE=0
    -DNFCCMD_DEBUG_LOG=1
    -DCORE_DEBUG_LEVEL=4

; 製品ビルド: HID のみ。PC 側に COM ポートが見えない
; =1 を除去して =0 を足す。文字列が異なるので =0 は残る
[env:release]
extends = cores3
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------------
; ホスト側ネイティブテスト (仕様書 §10.1)
; ハードウェアに依存しない純粋ロジックのみを対象とする
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<debounce.cpp> +<hid_sanitize.cpp> +<formatter.cpp> +<ndef_text.cpp> +<ndef_parse.cpp> +<hid_layout.cpp> +<settings.cpp> +<settings_menu.cpp> +<command_map.cpp> +<key_sequence.cpp>
build_flags =
    -std=gnu++17
    -I src
